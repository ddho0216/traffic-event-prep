.notes{color:var(--muted);font-size:14px;line-height:1.7;margin:0;max-width:72ch}
.notes strong{color:var(--ink);font-weight:normal;font-family:var(--font-sign);letter-spacing:.02em}

  if (has('pepper')) out.push(['으악 매워유!! 물! 물!', 'sad']);
  else if (r.items.length >= 4) out.push(['이게 다 뭐여?! …근디 맛있네.', 'good']);
  else if (bad) out.push(['이거 까매유…', 'sad']);
  else if (has('potato')) out.push(['감자 쫀득혀서 좋아유!', 'love']);
  else if (has('kimchi')) out.push(['김치전 최고여!', 'love']);
  else if (has('zucchini') || has('carrot')) out.push(['채소… 나 채소 싫은디.', 'meh']);
  else out.push(['음, 괜찮네유.', 'good']);
  if (r.salt === 0 && out[1][1] !== 'love') out[1] = ['쪼끔 싱거운디? 소금 쪼끔 더 치지.', 'meh'];
  if (r.salt >= 3) out[2] = ['짜! 물 좀 줘 봐유.', 'sad'];
  else if (r.oilType === 0 && !bad && r.oil < 3) out[2] = ['올리브유 썼구먼. 향이 은은허네.', 'love'];
  if (r.eggs > 0 && !bad && !raw && out[0][1] !== 'love') out[0] = ['계란 넣으니께 보들보들허네~', 'good'];
  if (r.pepper >= 2 && out[3][1] !== 'sad') out[3] = ['후추 냄새 좋아유!', 'good'];

}

let AC = null, master = null, muted = false, sizz = null;

  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.015 ? 1 : 0.3);
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;

}
function tone(f, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {

const sfx = {
  pick: () => tone(660, 0.08, 'triangle', 0.08),

  chop: () => { tone(200, 0.06, 'square', 0.1, -90); tone(2400, 0.02, 'square', 0.02); },
  water: () => tone(rnd(500, 700), 0.06, 'sine', 0.03, -200),
  stir: () => tone(rnd(180, 260), 0.05, 'sine', 0.03),
  oil: () => { tone(320, 0.12, 'sine', 0.06, -120); },
  pour: () => tone(300, 0.25, 'sine', 0.08, -120),

/* ================= 동작 ================= */
function makeJeon(items) {

  const specks = [];
  items.forEach(k => { const way = S && S.cutWay ? S.cutWay[k] : undefined, m = way === 'mince' ? 2 : 1; for (let i = 0; i < ING[k].sp * m; i++) { const d = Math.sqrt(Math.random()) * 0.74, a = rnd(0, 6.28); specks.push({ k, way, x: Math.cos(a) * d, y: Math.sin(a) * d, r: rnd(0, 6.28) }); } });
  const lace = Array.from({ length: 44 }, (_, i) => ({ a: i / 44 * 6.283 + rnd(-0.05, 0.05), d: rnd(1.0, 1.1), s: rnd(0.05, 0.11) }));
  const bubbles = Array.from({ length: 22 }, () => { const d = Math.sqrt(Math.random()) * 0.8, a = rnd(0, 6.28); return { x: Math.cos(a) * d, y: Math.sin(a) * d, s: rnd(0.025, 0.055) }; });

}
function togglePick(k) {

  if (S.picks.length >= 4) { say('네 가지믄 충분혀~ 하나 빼구 골라 봐.'); return; }
  S.picks.push(k); sfx.pick();
  say(S.picks.length === 1 ? `${ING[k].n} 좋지~ 더 넣어두 되구.` : `${S.picks.map(x => ING[x].n).join(', ')}이라… 뭔 전이 될라나 몰러?`);
}
function finishCut(k) {
  sfx.ding();

  else say('손질 끝났슈! 인저 반죽허러 가유~');

}
function addPieces(k, n) { for (let i = 0; i < n; i++) S.pile.push({ k, way: S.cutWay[k], x: rnd(-70, 70), y: rnd(-40, 40), r: rnd(0, 6.28) }); if (S.pile.length > 90) S.pile.splice(0, S.pile.length - 90); }

  const c = CUTS[S.cutWay[k]];
  if (c.mode === 'hold') { say('다지기는 도마를 꾹 누르구 있어야 혀~'); return; }
  if (S.chopA < 1 || S.cuts[k] >= needOf(k)) return;
  S.chopA = 0; sfx.chop();

}

}
function allCut() { return S.picks.every(k => S.cutWay[k] && S.cuts[k] >= needOf(k)) && S.cutIdx >= S.picks.length; }

  const p = S.pan;

    else say('지글지글~ 가장자리 색깔 보믄서 지달려 봐.');

  } else if (p.st === 'cook' && p.cur === 1) {

function toPlate() { sfx.ok(); goStage(4); }

  const base = BASE_ORDER.find(k => S.picks.includes(k));

function btnState() {
  switch (stage) {
    case 0: return { label: '손질하러 가기', on: S.picks.length > 0 };
    case 1: return { label: '반죽하러 가기', on: allCut() };
    case 2: return { label: '구우러 가기', on: batterReady() };
    case 3: return { label: '접시에 담기', on: S.pan.st === 'cook' && S.pan.cur === 1 };
    case 4: return { label: '식탁에 내기', on: true };
    case 5: return { label: '한 장 더 부치기', on: S.tableT > 3.2 };
  }

}
function goBack(n) {

  hold = null; sfx.unpick();
  stage = n; say(n === 0 ? '다시 골라 봐. 재료 바꾸믄 손질은 새루 혀야 혀~' : '돌아왔네. ' + TIP[n]);
}
function btnPress() {
  const b = btnState();

    const why = [
      '하나는 골라야 전을 부치지~',
      '아직 덜 썰었슈. 도마를 톡톡~',
      S.flour < 0 ? '가루부텀 골라야지~' : S.water < 15 ? '물이 모자라유. 주전자를 꾹~' : '덜 섞였어. 그릇을 꾹 누르구 있어 봐.',
      S.pan.st === 'empty' ? '팬을 눌러서 반죽부텀 부어 봐.' : '먼저 뒤집어야지. 팬을 톡~',
    ][stage];
    if (why) say(why);

/* ================= 업데이트 ================= */
function update(dt) {
  clock += dt; msgT += dt;
  if (phase === 'intro') introT += dt;
  if (phase !== 'play') return;
  if (stage === 1) {
    const k = S.picks[S.cutIdx], c = k && CUTS[S.cutWay[k]];
    S.mincing = !!(hold && hold.k === 'board' && c && c.mode === 'hold' && S.cuts[k] < 100 && S.advT === 0);
    if (S.mincing) {
      S.chopA = (S.chopA + dt / 0.09) % 1;
      S.cuts[k] = Math.min(100, S.cuts[k] + dt * 100 / c.secs);
      if (Math.random() < dt * 14) { sfx.chop(); addPieces(k, 2); }
      if (S.cuts[k] >= 100) finishCut(k);
    } else S.chopA = Math.min(1, S.chopA + dt / 0.14);
    if (S.advT > 0) { S.advT -= dt; if (S.advT <= 0) { S.advT = 0; S.cutIdx++; S.pile = []; } }
  }
  if (stage === 2 && hold) {
    if (hold.k === 'pitcher') {
      if (S.water < 100) { S.water = Math.min(100, S.water + 22 * dt); if (Math.random() < dt * 10) sfx.water(); if (S.mix > 0.4) S.mix = 0.4; }
      if (S.water >= 100 && msgT > 1) say('아이구, 물이 너무 많어! 그만 부어유!');
    } else if (hold.k === 'bowl') {
      if (S.flour < 0) { if (msgT > 1) say('가루부텀 골라야지~'); }
      else if (S.water < 15) { if (msgT > 1) say('물부텀 부어 봐. 주전자를 꾹~'); }
      else if (S.mix < 1) { S.mix = Math.min(1, S.mix + dt * 0.7); S.rot += dt * 7; if (Math.random() < dt * 7) sfx.stir(); if (S.mix >= 1) { sfx.ding(); say(`반죽이 ${BATTER_WORD[batterOf(S.water)]}네! 구우러 가유~`); } }
      else S.rot += dt * 7;
    }
  }
  if (stage === 3) {
    const p = S.pan;
    p.hold = !!(hold && hold.k === 'pan' && performance.now() - hold.t0 > 220 && p.st === 'cook');
    if (p.st === 'pour') { p.anim += dt / 0.4; if (p.anim >= 1) { p.st = 'cook'; p.anim = 0; } }
    if (p.st === 'flip') { p.anim += dt / 0.45; if (p.anim >= 1) { p.st = 'cook'; p.anim = 0; } }
    if (p.st !== 'empty') {
      p.sides[p.cur] += 8 * (p.hold ? 2 : 1) * (S.oilType === 1 && p.sides[p.cur] > 70 ? 0.65 : 1) * dt;
      const v = p.sides[p.cur];
      if (v >= 55 && !p.warned[p.cur]) { p.warned[p.cur] = 1; sfx.ding(); say(p.cur === 0 ? '시방이여! 노릇노릇허네, 톡 눌러서 뒤집어 봐!' : '다 익었슈! 접시에 담어유~'); }
      if (v > 95 && p.warned[p.cur] < 2) { p.warned[p.cur] = 2; say('아이구, 타는 냄새 나유! 얼릉 혀!'); }
      if (v > 95 && Math.random() < dt * 9) parts.push({ kind: 'smoke', x: PAN.x + rnd(-60, 60), y: PAN.y + rnd(-30, 30), vx: rnd(-8, 8), vy: rnd(-40, -25), life: 0, max: rnd(1.2, 2) });
      else if (Math.random() < dt * 4) parts.push({ kind: 'steam', x: PAN.x + rnd(-70, 70), y: PAN.y + rnd(-40, 40), vx: rnd(-5, 5), vy: rnd(-35, -20), life: 0, max: rnd(0.8, 1.3) });
      if (p.hold && Math.random() < dt * 20) parts.push({ kind: 'oil', x: PAN.x + rnd(-90, 90), y: PAN.y + rnd(-60, 50), vx: rnd(-40, 40), vy: rnd(-90, -50), life: 0, max: 0.35 });
    }
  }
  if (stage === 5) {
    const before = Math.floor((S.tableT - 0.6) / 0.6);
    S.tableT += dt;
    const after = Math.floor((S.tableT - 0.6) / 0.6);
    if (after !== before && after >= 0 && after < 4) sfx.pop(after);
  }
  if (AC && sizz) sizz.gain.setTargetAtTime(muted || stage !== 3 || S.pan.st === 'empty' ? 0 : (S.pan.hold ? 0.2 : 0.09), AC.currentTime, 0.08);
  parts.forEach(q => { q.life += dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.kind === 'oil') q.vy += 300 * dt; });

/* ================= 그리기 도우미 ================= */
function txt(s, x, y, size, col, align = 'left', font = FT) {

}

const FRAG_GRID = { dice: [4, 3], julienne: [11, 1], small: [8, 2], mince: [10, 8], slant: [5, 1], round: [5, 1], ring: [5, 1], chunk: [3, 1] };
const fragCache = {}, alphaCache = {};

  lp([[110, 30], [850, 30], [860, 40], [860, 560], [850, 570], [110, 570], [100, 560], [100, 40]], '#a2703f', 4);
  lp([[120, 40], [840, 40], [848, 48], [848, 552], [840, 560], [120, 560], [112, 552], [112, 48]], '#f3ead6', 3);
  const n = Object.keys(dexFound).length;
  txt('레시피 도감', 480, 78, 30, '#3a2418', 'center', FS);
  txt(`${n} / ${DEX.length} 맞춤 · 재료·썰기·가루까지 맞춰야 열려요`, 480, 102, 13, '#7a6450', 'center', FT);
  DEX.forEach((d, i) => {
    const col = i % 2, row = Math.floor(i / 2), x = 134 + col * 356, y = 114 + row * 86;
    const got = d.id in dexFound;
    ctx.fillStyle = got ? '#efe4c6' : '#d8cfbd'; rr(x, y, 344, 78, 6); ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 2; ctx.stroke();
    const im = IMG['dish_' + d.dish];
    if (im && okImg('dish_' + d.dish)) {
      ctx.save(); if (!got) { ctx.filter = 'brightness(0)'; ctx.globalAlpha = 0.28; }
      ctx.drawImage(im, x + 6, y + 6, 96, 66); ctx.restore();
    }
    if (got) {
      txt(d.n, x + 112, y + 30, 17, '#2a1c12', 'left', FS);
      txt(Object.entries(d.need).map(([k, w]) => `${ING[k].n} ${CUTS[w].n}`).join(' · '), x + 112, y + 50, 11, '#6a5644', 'left', FT);
      for (let h = 0; h < 4; h++) heart(x + 120 + h * 18, y + 66, 0.8, h < dexFound[d.id]);
    } else {
      txt('???', x + 112, y + 30, 17, '#6a5c4c', 'left', FS);
      txt('힌트: ' + d.hint, x + 112, y + 52, 12, '#6a5644', 'left', FT);
    }
  });
  txt('아무 데나 누르면 닫힘', 480, 552, 12, '#7a6450', 'center', FT);
}

function render() {
  ctx.clearRect(0, 0, W, H);
  if (phase === 'title') { drawTitle(); drawHeaderMini(); }
  else if (phase === 'intro') drawIntro();
  else {
    [drawPick, drawCut, drawBatter, drawFry, drawServe, drawTable][stage]();
    drawParts();
    if (stage < 5) drawVignette();
    drawCRT();
    drawHeader(); drawFooter();
  }
  if (showDex) drawDex();
}
function drawHeaderMini() {
  btn(DEXB.x, DEXB.y, DEXB.w, DEXB.h - 3, false, '도감', 15);
  btn(MUTE.x, MUTE.y, MUTE.w, MUTE.h - 3, false, muted ? '소리 끔' : '소리 켬', 14);
}
function drawParts() {
  parts.forEach(q => {
    const k = q.life / q.max;
    if (q.kind === 'steam') { ctx.globalAlpha = 0.35 * (1 - k); lp(ngon(q.x, q.y, 8 + k * 12, 7 + k * 10, 6, k), '#f4f4f2', 0); }
    else if (q.kind === 'smoke') { ctx.globalAlpha = 0.6 * (1 - k); lp(ngon(q.x, q.y, 10 + k * 20, 9 + k * 17, 6, k * 2), '#4d4945', 1.5); }
    else if (q.kind === 'oil') { ctx.globalAlpha = 1 - k; ctx.fillStyle = '#ffe9a8'; ctx.fillRect(q.x - 1.5, q.y - 1.5, 3, 3); }
  });
  ctx.globalAlpha = 1;
}

/* ================= 입력 ================= */
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
const inR = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
const dist = (x, y, a, b) => Math.hypot(x - a, y - b);
function hit(x, y) {
  if (showDex) return { k: 'closedex' };
  if (phase === 'intro') return inR(x, y, SKIP) ? { k: 'skip' } : { k: 'introNext' };
  if (inR(x, y, MUTE)) return { k: 'mute' };
  if (inR(x, y, DEXB)) return { k: 'dex' };
  if (phase === 'title') return inR(x, y, START) ? { k: 'start' } : null;
  if (inR(x, y, BTN)) return { k: 'btn' };
  if (stage > 0 && inR(x, y, PREV)) return { k: 'back', i: stage - 1 };
  for (let i = 0; i < stage; i++) if (HDR[i] && inR(x, y, HDR[i])) return { k: 'back', i };
  if (stage === 0) { for (const c of CARDS) if (inR(x, y, c)) return { k: 'card', id: c.k }; }
  if (stage === 1) {
    const k = S.picks[S.cutIdx];
    if (k && !S.cutWay[k]) { for (let i = 0; i < 3; i++) if (inR(x, y, CUTBTN(i))) return { k: 'cutway', w: CUT_OF[k][i] }; return null; }
    if (inR(x, y, BOARD) || inR(x, y, { x: 240, y: 280, w: 480, h: 240 })) return { k: 'board' };
  }
  if (stage === 2) {
    for (const b of BAGS) if (inR(x, y, b)) return { k: 'flour', i: b.i };
    if (inR(x, y, EGGS)) return { k: 'egg' };
    if (inR(x, y, SALT)) return { k: 'salt' };
    if (inR(x, y, PEPPER)) return { k: 'pepper' };
    if (inR(x, y, { x: PITCHER.x - 20, y: PITCHER.y, w: PITCHER.w + 40, h: PITCHER.h + 30 })) return { k: 'pitcher' };
    if (inR(x, y, { x: 336, y: 322, w: 288, h: 206 })) return { k: 'bowl' };
  }
  if (stage === 3) {
    for (const b of OILB) if (inR(x, y, b)) return { k: 'oil', i: b.i };
    if (inR(x, y, TOWEL)) return { k: 'towel' };
    if (((x - PAN.x) / (PAN.r + 14)) ** 2 + ((y - PAN.y) / (PAN.r * 0.52 + 12)) ** 2 < 1) return { k: 'pan' };
  }
  if (stage === 4) {
    for (const o of PL_OPTS) if (inR(x, y, o)) return { k: 'plate', i: o.i };
    for (const o of DIP_OPTS) if (inR(x, y, o)) return { k: 'dip', i: o.i };
    for (const o of CUT_OPTS) if (inR(x, y, o)) return { k: 'cut', i: o.i };
  }
  return null;
}
function act(h) {
  switch (h.k) {
    case 'closedex': showDex = false; break;
    case 'dex': showDex = true; break;
    case 'mute': muted = !muted; if (master) master.gain.value = muted ? 0 : 0.6; break;
    case 'start': phase = 'intro'; introI = 0; introT = 0; break;
    case 'skip': phase = 'play'; freshRound(); break;
    case 'introNext': introNext(); break;
    case 'btn': btnPress(); break;
    case 'back': goBack(h.i); break;
    case 'card': togglePick(h.id); break;
    case 'board': chop(); break;
    case 'cutway': pickCut(h.w); break;
    case 'flour': S.flour = h.i; sfx.pick(); say(`${FLOURS[h.i].n}. ${FLOURS[h.i].d}.`); break;
    case 'oil':
      if (S.pan.st !== 'empty') { say('기름은 붓기 전에 두르는 겨~'); break; }
      if (S.oilType !== h.i) { S.oilType = h.i; S.oil = 1; } else S.oil = S.oil % 3 + 1;
      S.towel = false; sfx.oil();
      say(`${OILS[h.i].n} ${['', '조금', '적당히', '듬뿍'][S.oil]}. ${OILS[h.i].d}.`); break;
    case 'towel':
      if (S.pan.st !== 'empty') { say('시방은 팬이 뜨거워유. 이따가 닦어.'); break; }
      if (!S.oil) { say('기름부텀 둘러야 펴지~'); break; }
      S.towel = true; sfx.pick(); say('키친타올로 기름 고루 폈네. 남는 건 싹 닦였슈~'); break;
    case 'egg': S.eggs = (S.eggs + 1) % 3; if (S.mix > 0.6) S.mix = 0.6; sfx.pick(); say(S.eggs ? `계란 ${S.eggs}개! 반죽이 보들보들허겄네~` : '계란은 뺐어.'); break;
    case 'salt': S.salt = (S.salt + 1) % 4; if (S.mix > 0.6) S.mix = 0.6; sfx.pick(); say(['소금 뺐슈. 싱거울 겨.', '소금 쪼끔.', '소금 적당히~', '소금 많이! 짜겄는디?'][S.salt]); break;
    case 'pepper': S.pepper = (S.pepper + 1) % 4; if (S.mix > 0.6) S.mix = 0.6; sfx.pick(); say(['후추는 뺐어.', '후추 톡~', '후추 톡톡~', '후추 잔뜩이여!'][S.pepper]); break;
    case 'plate': S.plate = h.i; sfx.pick(); break;
    case 'dip': S.dip = h.i; sfx.pick(); break;
    case 'cut': S.cut = h.i; sfx.chop(); break;
  }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const [x, y] = pos(e); const h = hit(x, y);
  if (!h) return;
  const kk = S && S.picks[S.cutIdx];
  if (h.k === 'bowl' || h.k === 'pan' || h.k === 'pitcher' || (h.k === 'board' && kk && CUTS[S.cutWay[kk]] && CUTS[S.cutWay[kk]].mode === 'hold')) {
    hold = { ...h, t0: performance.now() };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  act(h);
});
cv.addEventListener('pointermove', e => {
  if (!hold) return;
  const [x, y] = pos(e); const h = hit(x, y);
  if (!h || h.k !== hold.k) { hold = null; S.pan.hold = false; }
});
cv.addEventListener('pointerup', () => {
  if (!hold) return;
  if (hold.k === 'pan' && performance.now() - hold.t0 < 220) panTap();
  hold = null;
});
cv.addEventListener('pointercancel', () => { hold = null; });
cv.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); initAudio();
    if (showDex) showDex = false;
    else if (phase === 'title') act({ k: 'start' });
    else if (phase === 'intro') introNext();
    else if (stage === 1 && !allCut()) chop();
    else btnPress();
  }
});

/* ================= 루프 ================= */
let last = performance.now();
/* 그림·글꼴을 다 불러온 뒤에 시작 (처음에 대체 그림이 보였다 바뀌는 현상 방지) */
let ready = false, readyT0 = performance.now(), fontsOk = false;
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(() => { fontsOk = true; });
function allImgs() { return [...Object.values(IMG), ...Object.values(window.CHAR_IMGS || {})]; }
function loadedCount() { const a = allImgs(); return [a.filter(i => i.complete).length, a.length]; }
function drawLoading() {
  const [n, t] = loadedCount();
  ctx.fillStyle = '#2e2b29'; ctx.fillRect(0, 0, W, H);
  ctx.font = '22px sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#f4ecdc'; ctx.fillText('불러오는 중…', 480, 280);
  ctx.fillStyle = '#1d1712'; ctx.fillRect(330, 304, 300, 18);
  ctx.fillStyle = '#e8a83a'; ctx.fillRect(333, 307, 294 * (t ? n / t : 0), 12);
}
function frame(now) {
  if (!ready) {
    const [n, t] = loadedCount();
    if ((n >= t && fontsOk) || now - readyT0 > 12000) { ready = true; last = now; }
    else { drawLoading(); requestAnimationFrame(frame); return; }
  }
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
freshRound();
requestAnimationFrame(frame);
window.__jeon = { get state() { return { phase, stage, S }; } };
})();
</script>
