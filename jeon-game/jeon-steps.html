<title>할머니 전집 연습장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 16:10 canvas stage on a rainy-night ground, short notes underneath. Single dark look by choice. */
:root{
  --night:#191d22;
  --ink:#f1e7d3;
  --muted:#a59c8b;
  --oil:#e2a43a;
  --stage:#2a2320;
  --font-sign:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-text:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);font-family:var(--font-text);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
canvas{width:100%;max-width:100%;aspect-ratio:16/10;display:block;border-radius:6px;touch-action:none;background:var(--stage);user-select:none;-webkit-user-select:none}
canvas:focus-visible{outline:2px solid var(--oil);outline-offset:3px}
.notes{color:var(--muted);font-size:14px;line-height:1.7;margin:0;max-width:72ch}
.notes strong{color:var(--ink);font-weight:normal;font-family:var(--font-sign);letter-spacing:.02em}
</style>

<div class="wrap">
  <canvas id="c" width="1920" height="1200" tabindex="0" aria-label="할머니 전집 연습장 게임 화면"></canvas>
  <p class="notes"><strong>차근차근 모드</strong> 시간 제한도, 기다리다 가는 손님도 없습니다. 왼쪽 위 칠판에 지금 단계가 표시되고, 할머니가 할 일을 알려 줍니다. 주문한 재료 칸은 금색 테두리로 반짝입니다.</p>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 600;
ctx.setTransform(2, 0, 0, 2, 0, 0);
const FS = '"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FT = '"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

/* ---------- 데이터 (장사 모드와 같음) ---------- */
const ING = {
  flour:  { n: '부침가루', c: '#efe4c8' },
  kimchi: { n: '김치',     c: '#c8452f' },
  buchu:  { n: '부추',     c: '#4f8a3a' },
  squid:  { n: '오징어',   c: '#f4eee6' },
  onion:  { n: '양파',     c: '#d9c6d8' },
  pepper: { n: '청양고추', c: '#3f7a2a' },
};
const BIN_ORDER = ['flour', 'kimchi', 'buchu', 'squid', 'onion', 'pepper'];
const BASES = { kimchi: { n: '김치전', price: 9000 }, buchu: { n: '부추전', price: 8000 } };
const TOPS = ['pepper', 'squid', 'onion'];
const TOP_WORD = { pepper: '땡초', squid: '오징어', onion: '양파' };
const STEPS = ['주문 받기', '재료 담기', '반죽 섞기', '아랫면 굽기', '윗면 굽기', '손님상 내기'];
const DONE_WORD = { raw: '덜 익음', soft: '살짝 덜 익음', gold: '노릇노릇', dark: '진하게 익음', burnt: '탔음' };

/* 할머니 대사 초안 (제가 만든 것 — 직접 고쳐 쓰시면 됩니다) */
const TIP = [
  '손님 주문부터 잘 듣자. 말풍선을 봐.',
  '반짝이는 칸이 주문한 재료다. 부침가루는 꼭 넣고.',
  '그릇을 꾹 누르고 있어 봐. 고루 섞일 때까지.',
  '팬을 눌러서 반죽을 부어.',
  '이제 윗면. 막대가 금색 칸에 오면 접시에 담아.',
];
const COOK_TIP = '가장자리 색 봐라. 막대가 금색 칸에 오면 뒤집어.';

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const won = n => n.toLocaleString('ko-KR') + '원';
const easeOut = t => 1 - Math.pow(1 - t, 3);

function dishName(items) {
  const has = k => items.includes(k);
  let base, used = null;
  if (has('kimchi') && has('buchu')) base = '김치부추전';
  else if (has('kimchi')) base = '김치전';
  else if (has('buchu')) base = '부추전';
  else if (has('squid')) { base = '오징어전'; used = 'squid'; }
  else if (has('onion')) { base = '양파전'; used = 'onion'; }
  else if (has('pepper')) { base = '고추전'; used = 'pepper'; }
  else base = '맨전';
  const pre = TOPS.filter(t => has(t) && t !== used).map(t => TOP_WORD[t]);
  return [...pre, base].join(' ');
}
function orderName(o) { return [...TOPS.filter(t => o.tops.includes(t)).map(t => TOP_WORD[t]), BASES[o.base].n].join(' '); }

const STOPS = [[0, '#efe2b8'], [45, '#e8cf8a'], [60, '#dba54a'], [80, '#c27f2c'], [95, '#6b4018'], [110, '#2a1c12']];
function hex2rgb(h) { h = h.slice(1); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function doneColor(v) {
  v = clamp(v, 0, 110);
  for (let i = 0; i < STOPS.length - 1; i++) {
    const [a, ca] = STOPS[i], [b, cb] = STOPS[i + 1];
    if (v <= b) {
      const t = (v - a) / (b - a), A = hex2rgb(ca), B = hex2rgb(cb);
      return `rgb(${A.map((x, j) => Math.round(lerp(x, B[j], t))).join(',')})`;
    }
  }
  return STOPS[STOPS.length - 1][1];
}
function quality(v) {
  if (v < 40) return { q: 0.35, w: 'raw' };
  if (v < 55) return { q: 0.75, w: 'soft' };
  if (v <= 82) return { q: 1, w: 'gold' };
  if (v <= 95) return { q: 0.7, w: 'dark' };
  return { q: 0.15, w: 'burnt' };
}

/* ---------- 배치 ---------- */
const BINS = BIN_ORDER.map((k, i) => ({ k, x: 24 + (i % 3) * 96, y: 262 + Math.floor(i / 3) * 88, w: 88, h: 80 }));
const TRASH = { x: 24, y: 448, w: 280, h: 52 };
const BOWL = { x: 410, y: 335, r: 68 };
const PAN = { x: 680, y: 335, r: 78 };
const BTN = { x: 716, y: 516, w: 226, h: 58 };
const MUTE = { x: 874, y: 262, w: 66, h: 34 };
const CUST_X = 560;

/* ---------- 상태 ---------- */
let phase = 'title', step = 0;
let cust = null, bowl, pan, dish = null, result = null;
let money = 0, served = 0, golds = 0;
let msg = TIP[0], msgT = 0;
let parts = [], hold = null, clock = 0;
let dex = new Set();
try { const s = JSON.parse(localStorage.getItem('jeon-dex-v1') || '[]'); if (Array.isArray(s)) dex = new Set(s); } catch (e) {}
function saveDex() { try { localStorage.setItem('jeon-dex-v1', JSON.stringify([...dex])); } catch (e) {} }
function say(s) { msg = s; msgT = 0; }
const emptyBowl = () => ({ items: [], mix: 0, specks: [], rot: 0 });
const emptyPan = () => ({ st: 'empty', jeon: null, sides: [0, 0], cur: 0, anim: 0, hold: false, warned: [false, false] });

function newCustomer() {
  const base = pick(['kimchi', 'buchu']);
  const nt = served < 1 ? 0 : served < 3 ? Math.floor(rnd(0, 2)) : Math.floor(rnd(0, 3));
  const tops = [...TOPS].sort(() => Math.random() - 0.5).slice(0, nt);
  return {
    order: { base, tops }, st: 'in', a: 0, mood: 'neutral', say: '',
    look: {
      skin: pick(['#f1cfae', '#e6b48f', '#d49a72', '#f5d9bf']),
      hair: pick(['#2b2420', '#4a3426', '#6b6058', '#1f1a1e']),
      shirt: pick(['#5b7d8a', '#8a5b4f', '#6f7f4e', '#7a6a8f', '#3f5a73', '#a07a3c']),
      style: Math.floor(rnd(0, 4)),
    },
  };
}
function startRound() {
  cust = newCustomer(); bowl = emptyBowl(); pan = emptyPan(); dish = null; result = null;
  step = 0; say(TIP[0]); sfx.bell();
}
function goStep(n) { step = n; if (TIP[n]) say(TIP[n]); }

/* ---------- 소리 ---------- */
let AC = null, master = null, muted = false, sizz = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.015 ? 1 : 0.3);
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
    sizz = AC.createGain(); sizz.gain.value = 0;
    src.connect(hp); hp.connect(sizz); sizz.connect(master); src.start();
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
}
const sfx = {
  drop: i => tone(480 + i * 45, 0.08, 'triangle', 0.09),
  pour: () => tone(300, 0.25, 'sine', 0.08, -120),
  flip: () => { tone(150, 0.13, 'triangle', 0.3, -70); tone(900, 0.05, 'square', 0.03, 0, 0.02); },
  coin: () => { tone(1320, 0.1, 'square', 0.05); tone(1760, 0.18, 'square', 0.05, 0, 0.08); },
  bell: () => { tone(880, 0.5, 'sine', 0.1); tone(1175, 0.6, 'sine', 0.07, 0, 0.12); },
  bad:  () => tone(220, 0.25, 'sawtooth', 0.06, -60),
  plate:() => { tone(1400, 0.06, 'sine', 0.06); tone(1050, 0.08, 'sine', 0.05, 0, 0.05); },
  stir: () => tone(rnd(180, 260), 0.05, 'sine', 0.03),
  ok:   () => { tone(660, 0.1, 'triangle', 0.08); tone(990, 0.15, 'triangle', 0.08, 0, 0.09); },
};

/* ---------- 동작 ---------- */
const SPECK_N = { kimchi: 9, buchu: 12, squid: 5, onion: 6, pepper: 7, flour: 0 };
function addIng(k) {
  if (bowl.items.includes(k)) { // 다시 누르면 빼기
    bowl.items = bowl.items.filter(x => x !== k);
    bowl.specks = bowl.specks.filter(s => s.k !== k);
    say(`${ING[k].n} 뺐다.`); return;
  }
  bowl.items.push(k); sfx.drop(bowl.items.length);
  for (let i = 0; i < Math.max(3, SPECK_N[k] / 2); i++) bowl.specks.push({ k, a: rnd(0, 6.28), d: rnd(0.1, 0.75), r: rnd(0, 6.28) });
  const need = [ 'flour', cust.order.base, ...cust.order.tops ];
  const left = need.filter(x => !bowl.items.includes(x));
  if (!need.includes(k)) say(`${ING[k].n}는 주문에 없다. 넣어도 되지만 손님이 갸웃할 거다.`);
  else if (left.length) say(`좋다. 남은 재료: ${left.map(x => ING[x].n).join(', ')}`);
  else say('다 담았다. 오른쪽 아래 버튼 눌러.');
}
function makeJeon(items) {
  const shape = Array.from({ length: 20 }, () => rnd(0.9, 1.05));
  const specks = [];
  items.forEach(k => { for (let i = 0; i < SPECK_N[k]; i++) { const d = Math.sqrt(Math.random()) * 0.74, a = rnd(0, 6.28); specks.push({ k, x: Math.cos(a) * d, y: Math.sin(a) * d, r: rnd(0, 6.28) }); } });
  return { items: [...items], shape, specks };
}
function pour() {
  pan.st = 'pour'; pan.anim = 0; pan.jeon = makeJeon(bowl.items);
  bowl = emptyBowl(); sfx.pour(); say(COOK_TIP);
}
function flip() { pan.st = 'flip'; pan.anim = 0; pan.cur = 1; sfx.flip(); goStep(4); }
function plateUp() {
  const name = dishName(pan.jeon.items);
  dish = { jeon: pan.jeon, sides: [...pan.sides], name };
  const isNew = !dex.has(name);
  if (isNew) { dex.add(name); saveDex(); }
  pan = emptyPan(); sfx.plate();
  evaluate(isNew);
  goStep(5);
}
function evaluate(isNew) {
  const items = dish.jeon.items, o = cust.order;
  const other = o.base === 'kimchi' ? 'buchu' : 'kimchi';
  const baseOK = items.includes(o.base), extraBase = items.includes(other);
  const miss = o.tops.filter(k => !items.includes(k));
  const extra = items.filter(k => TOPS.includes(k) && !o.tops.includes(k));
  if (extraBase) extra.unshift(other);
  const qa = quality(dish.sides[0]), qb = quality(dish.sides[1]);
  const s = (baseOK ? 1 : 0.3) * (extraBase ? 0.85 : 1) * Math.max(0.2, 1 - 0.2 * miss.length - 0.15 * (extra.length - (extraBase ? 1 : 0))) * ((qa.q + qb.q) / 2);
  const pay = Math.round(BASES[o.base].price * s / 100) * 100;
  money += pay; served++;
  let line, gline, mood;
  if (!baseOK) { line = '제가 시킨 건 이게 아닌데요?'; gline = '잘못 나간 것도 정이다. 다음엔 말풍선 잘 보자.'; mood = 'sad'; }
  else if (qa.w === 'burnt' || qb.w === 'burnt') { line = '이거… 숯 아닌가요?'; gline = '까만 것도 전이다. 다음엔 조금 일찍 뒤집자.'; mood = 'angry'; }
  else if (qa.w === 'raw' || qb.w === 'raw') { line = '속이 덜 익었네요.'; gline = '덜 익은 것도 전이다. 다음엔 조금 더 기다리자.'; mood = 'sad'; }
  else if (miss.length) { line = `${TOP_WORD[miss[0]]}이(가) 빠졌어요.`; gline = '재료 하나 빠졌다. 반짝이는 칸 다 넣었나 보자.'; mood = 'sad'; }
  else if (s >= 0.85) { line = pick(['이 집 잘하네요!', '딱 이 맛이에요.', '비 오는 날엔 역시 전이죠.']); gline = '그래, 그 색이야. 노릇노릇.'; mood = 'happy'; golds++; }
  else { line = '먹을 만하네요.'; gline = '먹을 만하면 된 거다. 금색 칸을 노려 봐.'; mood = 'neutral'; }
  cust.mood = mood; cust.say = line;
  result = { s, pay, baseOK, miss, extra, qa, qb, isNew };
  say(gline);
  if (pay > 0) { sfx.coin(); parts.push({ kind: 'txt', x: CUST_X, y: 150, vx: 0, vy: -30, life: 0, max: 1.4, s: `+${won(pay)}`, col: '#f1e7d3' }); }
  if (mood === 'sad' || mood === 'angry') sfx.bad(); else sfx.ok();
}
function nextGuest() { cust.st = 'out'; cust.a = 0; step = -1; }

function btnState() {
  switch (step) {
    case 0: return { label: '주문 받기', on: cust && cust.st === 'wait' };
    case 1: return { label: '섞으러 가기', on: bowl.items.includes('flour') };
    case 2: return { label: '굽으러 가기', on: bowl.mix >= 1 };
    case 3: return { label: '뒤집기', on: pan.st === 'cook' };
    case 4: return { label: '접시에 담기', on: pan.st === 'cook' };
    case 5: return { label: '다음 손님', on: true };
    default: return { label: '…', on: false };
  }
}
function btnPress() {
  const b = btnState();
  if (!b.on) {
    if (step === 1) say('부침가루가 없으면 전이 안 된다. 부침가루부터.');
    else if (step === 2) say('아직 덜 섞였다. 그릇을 꾹 누르고 있어.');
    else if (step === 3 && pan.st === 'empty') say('먼저 팬을 눌러 반죽을 부어.');
    return;
  }
  sfx.ok();
  if (step === 0) goStep(1);
  else if (step === 1) goStep(2);
  else if (step === 2) goStep(3);
  else if (step === 3) flip();
  else if (step === 4) plateUp();
  else if (step === 5) nextGuest();
}
function panTap() {
  if (step === 3 && pan.st === 'empty') pour();
  else if (step === 3 && pan.st === 'cook') flip();
  else if (step === 4 && pan.st === 'cook') plateUp();
}

/* ---------- 업데이트 ---------- */
function update(dt) {
  clock += dt; msgT += dt;
  if (phase !== 'play') return;
  if (cust) {
    if (cust.st === 'in') { cust.a += dt / 0.5; if (cust.a >= 1) { cust.st = 'wait'; cust.a = 1; } }
    else if (cust.st === 'out') { cust.a += dt / 1.2; if (cust.a >= 1) startRound(); }
  }
  if (step === 2 && hold && hold.k === 'bowl' && bowl.items.length) {
    if (bowl.mix < 1) {
      bowl.mix = Math.min(1, bowl.mix + dt * 0.7);
      if (Math.random() < dt * 7) sfx.stir();
      if (bowl.mix >= 1) { say('잘 섞였다. 이제 굽으러 가자.'); sfx.ok(); }
    }
    bowl.rot += dt * 7;
  }
  pan.hold = !!(hold && hold.k === 'pan' && performance.now() - hold.t0 > 220 && pan.st === 'cook');
  if (pan.st === 'pour') { pan.anim += dt / 0.35; if (pan.anim >= 1) { pan.st = 'cook'; pan.anim = 0; } }
  if (pan.st === 'flip') { pan.anim += dt / 0.42; if (pan.anim >= 1) { pan.st = 'cook'; pan.anim = 0; } }
  if (pan.st !== 'empty') {
    pan.sides[pan.cur] += 7 * (pan.hold ? 2 : 1) * dt;
    const v = pan.sides[pan.cur];
    if (v > 55 && v < 56.5 && !pan.warned[pan.cur]) { pan.warned[pan.cur] = 'gold'; say(pan.cur === 0 ? '지금이다! 노릇하다. 뒤집어.' : '지금이다! 접시에 담아.'); tone(1040, 0.12, 'triangle', 0.07); }
    if (v > 95 && pan.warned[pan.cur] !== 'smoke') { pan.warned[pan.cur] = 'smoke'; say('타는 냄새 난다! 얼른!'); }
    if (v > 95 && Math.random() < dt * 9) parts.push({ kind: 'smoke', x: PAN.x + rnd(-40, 40), y: PAN.y + rnd(-20, 20), vx: rnd(-8, 8), vy: rnd(-40, -25), life: 0, max: rnd(1.2, 2) });
    else if (Math.random() < dt * 3) parts.push({ kind: 'steam', x: PAN.x + rnd(-45, 45), y: PAN.y + rnd(-25, 25), vx: rnd(-5, 5), vy: rnd(-35, -20), life: 0, max: rnd(0.8, 1.3) });
  }
  if (AC && sizz) sizz.gain.setTargetAtTime(muted || pan.st === 'empty' ? 0 : (pan.hold ? 0.2 : 0.09), AC.currentTime, 0.08);
  parts.forEach(q => { q.life += dt; q.x += q.vx * dt; q.y += q.vy * dt; });
  parts = parts.filter(q => q.life < q.max);
}

/* ---------- 그리기 도우미 ---------- */
function txt(s, x, y, size, col, align = 'left', font = FT) {
  ctx.font = `${size}px ${font}`; ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.fillText(s, x, y);
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

function drawSpeck(s, R, alpha) {
  ctx.save(); ctx.translate(s.x * R, s.y * R); ctx.rotate(s.r); ctx.globalAlpha = alpha;
  switch (s.k) {
    case 'kimchi': ctx.fillStyle = '#c23b25'; ctx.beginPath(); ctx.moveTo(-6, -3); ctx.lineTo(5, -4); ctx.lineTo(7, 2); ctx.lineTo(-4, 4); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#e9d6a8'; ctx.fillRect(-2, -1, 5, 1.6); break;

  const R = result, X = 330, X2 = 676;
  const rows = [
    ['주문', orderName(cust.order), '#2a1c12'],
    ['주재료', R.baseOK ? '맞음' : `틀림 (${BASES[cust.order.base].n})`, R.baseOK ? '#5f7f34' : '#a8442e'],
    ['빠진 재료', R.miss.length ? R.miss.map(k => ING[k].n).join(', ') : '없음', R.miss.length ? '#a8442e' : '#5f7f34'],
    ['더 넣은 재료', R.extra.length ? R.extra.map(k => ING[k].n).join(', ') : '없음', R.extra.length ? '#b0772a' : '#5f7f34'],
    ['아랫면', DONE_WORD[R.qa.w], R.qa.w === 'gold' ? '#5f7f34' : '#a8442e'],
    ['윗면', DONE_WORD[R.qb.w], R.qb.w === 'gold' ? '#5f7f34' : '#a8442e'],
  ];
  rows.forEach(([a, b, c], i) => {
    txt(a, X, 300 + i * 32, 16, '#6a5644', 'left', FT);
    txt(b, X2, 300 + i * 32, 18, c, 'right', FS);
  });
  ctx.strokeStyle = 'rgba(90,70,54,0.3)'; ctx.beginPath(); ctx.moveTo(X, 494); ctx.lineTo(X2, 494); ctx.stroke();
  txt('받은 돈', X, 528, 18, '#6a5644', 'left', FT);
  txt(won(R.pay), X2, 532, 30, '#2a1c12', 'right', FS);
  txt(`점수 ${Math.round(R.s * 100)}점`, X2, 560, 14, '#7a6450', 'right', FT);
  txt(`도감 ${dex.size}종`, 820, 300, 16, '#d9cdb8', 'center', FS);
  txt(`노릇하게 낸 전 ${golds}장`, 820, 326, 14, '#a59c8b', 'center', FT);
}
function drawParts() {
  parts.forEach(q => {
    const k = q.life / q.max;
    if (q.kind === 'txt') { ctx.globalAlpha = 1 - k; txt(q.s, q.x, q.y, 22, q.col, 'center', FS); }
    else if (q.kind === 'steam') { ctx.globalAlpha = 0.25 * (1 - k); ctx.fillStyle = '#f2f2f2'; circle(q.x, q.y, 6 + k * 10); ctx.fill(); }
    else if (q.kind === 'smoke') { ctx.globalAlpha = 0.45 * (1 - k); ctx.fillStyle = '#55504a'; circle(q.x, q.y, 9 + k * 18); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
}
function drawMute() {
  ctx.fillStyle = 'rgba(0,0,0,0.3)'; rr(MUTE.x, MUTE.y, MUTE.w, MUTE.h, 6); ctx.fill();
  txt(muted ? '소리 끔' : '소리 켬', MUTE.x + MUTE.w / 2, MUTE.y + 23, 14, '#d9cdb8', 'center', FS);
}
const TITLE_BTN = { x: 380, y: 448, w: 200, h: 54 };
const demoJeon = makeJeon(['flour', 'buchu', 'squid', 'onion']);
function drawTitle() {
  ctx.fillStyle = 'rgba(20,16,14,0.8)'; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.translate(480, 112);
  ctx.fillStyle = '#7a5434'; rr(-210, -62, 420, 112, 8); ctx.fill();
  ctx.fillStyle = '#efe2c6'; rr(-200, -52, 400, 92, 4); ctx.fill();
  txt('할머니 전집', 0, 18, 64, '#3a2418', 'center', FS);
  ctx.restore();
  txt('차근차근 모드 · 시간 제한 없이 한 단계씩', 480, 202, 18, '#f3c552', 'center', FS);
  drawJeon(170, 330, 70, demoJeon, 68, 76);
  drawJeon(790, 330, 70, demoJeon, 60, 70);
  STEPS.forEach((s, i) => {
    const y = 258 + i * 28;
    ctx.fillStyle = '#e2a43a'; circle(400, y - 6, 10); ctx.fill();
    txt(String(i + 1), 400, y - 1, 13, '#2a1c12', 'center', FS);
    txt(s, 420, y, 18, '#f1e7d3', 'left', FT);
  });
  ctx.fillStyle = '#e2a43a'; rr(TITLE_BTN.x, TITLE_BTN.y, TITLE_BTN.w, TITLE_BTN.h, 8); ctx.fill();
  txt('연습 시작', 480, TITLE_BTN.y + 36, 24, '#2a1c12', 'center', FS);
  if (dex.size) txt(`지금까지 발견한 전 ${dex.size}종`, 480, 534, 14, '#a59c8b', 'center', FT);
}
function render() {
  ctx.clearRect(0, 0, W, H);
  drawShop();
  if (phase === 'play' && cust) drawCustomer(cust, CUST_X);
  drawStepBoard();
  drawCounter();
  drawKitchen();
  if (phase === 'play') {
    drawBins(); drawBowl(); drawPan();
    if (step === 5 && dish) drawResult();
    drawButton();
  }
  drawParts();
  if (phase === 'title') drawTitle();
  drawMute();
}

/* ---------- 입력 ---------- */
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
const inR = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
const dist = (x, y, a, b) => Math.hypot(x - a, y - b);
function hit(x, y) {
  if (inR(x, y, MUTE)) return { k: 'mute' };
  if (phase === 'title') return inR(x, y, TITLE_BTN) ? { k: 'start' } : null;
  if (inR(x, y, BTN)) return { k: 'btn' };
  if (step === 5) return null;
  if (step === 1) {
    for (const b of BINS) if (inR(x, y, b)) return { k: 'bin', id: b.k };
    if (inR(x, y, TRASH)) return { k: 'trash' };
  }
  if (step === 2 && dist(x, y, BOWL.x, BOWL.y) < BOWL.r + 12) return { k: 'bowl' };
  if ((step === 3 || step === 4) && dist(x, y, PAN.x, PAN.y) < PAN.r + 12) return { k: 'pan' };
  return null;
}
function act(h) {
  if (h.k === 'mute') { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.6; }
  else if (h.k === 'start') { phase = 'play'; startRound(); }
  else if (h.k === 'btn') btnPress();
  else if (h.k === 'bin') addIng(h.id);
  else if (h.k === 'trash') { bowl = emptyBowl(); say('그릇 비웠다. 다시 담아.'); }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const [x, y] = pos(e); const h = hit(x, y);
  if (!h) return;
  if (h.k === 'bowl' || h.k === 'pan') {
    hold = { ...h, t0: performance.now() };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  act(h);
});
cv.addEventListener('pointermove', e => {
  if (!hold) return;
  const [x, y] = pos(e); const h = hit(x, y);
  if (!h || h.k !== hold.k) hold = null;
});
cv.addEventListener('pointerup', () => {
  if (!hold) return;
  if (hold.k === 'pan' && performance.now() - hold.t0 < 220) panTap();
  hold = null;
});
cv.addEventListener('pointercancel', () => { hold = null; });
cv.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); initAudio();
    if (phase === 'title') act({ k: 'start' }); else btnPress();
  }
});

/* ---------- 루프 ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
bowl = emptyBowl(); pan = emptyPan();
requestAnimationFrame(frame);
window.__jeon = { get state() { return { phase, step, bowl, pan, cust, dish, result, money }; } };
})();
</script>
