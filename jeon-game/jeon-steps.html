<title>오늘 저녁은 전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&display=swap">
<style>
/* Layout: 16:10 canvas stage on a rainy-evening ground, short notes underneath. Single dark look by choice. */
:root{
  --night:#191d22;
  --ink:#f1e7d3;
  --muted:#a59c8b;
  --oil:#e2a43a;
  --stage:#2a2320;
  --font-sign:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-text:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--night);color:var(--ink);font-family:var(--font-text);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box;
}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
canvas{width:100%;max-width:100%;aspect-ratio:16/10;display:block;border-radius:6px;touch-action:none;background:var(--stage);user-select:none;-webkit-user-select:none}
canvas:focus-visible{outline:2px solid var(--oil);outline-offset:3px}
.notes{color:var(--muted);font-size:14px;line-height:1.7;margin:0;max-width:72ch}
.notes strong{color:var(--ink);font-weight:normal;font-family:var(--font-sign);letter-spacing:.02em}
</style>

<div class="wrap">
  <canvas id="c" width="1920" height="1200" tabindex="0" aria-label="오늘 저녁은 전 게임 화면"></canvas>
  <p class="notes"><strong>틀린 전은 없다</strong> 재료 고르기 → 손질하기 → 반죽 만들기 → 굽기 → 담기 → 저녁 식탁. 어떤 조합이든 이름이 붙고, 가족들이 한마디씩 합니다. 처음 만든 전은 도감에 모입니다.</p>
</div>

<script>
(() => {
"use strict";
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 600;
ctx.setTransform(2, 0, 0, 2, 0, 0);
const FS = '"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const FT = '"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif';

/* ================= 데이터 (배열만 늘리면 재료·레시피가 늘어남) ================= */
const ING = {
  kimchi:   { n: '김치',     w: '김치',   c: '#c8452f', chops: 6, sp: 9 },
  buchu:    { n: '부추',     w: '부추',   c: '#4f8a3a', chops: 5, sp: 12 },
  zucchini: { n: '애호박',   w: '호박',   c: '#8fb84e', chops: 6, sp: 7 },
  potato:   { n: '감자',     w: '감자',   c: '#d9bf7f', chops: 7, sp: 10 },
  squid:    { n: '오징어',   w: '오징어', c: '#f4eee6', chops: 5, sp: 6 },
  onion:    { n: '양파',     w: '양파',   c: '#d9c6d8', chops: 5, sp: 7 },
  carrot:   { n: '당근',     w: '당근',   c: '#e07b2e', chops: 6, sp: 9 },
  pepper:   { n: '청양고추', w: '땡초',   c: '#3f7a2a', chops: 4, sp: 7 },
};
const FRIDGE = ['kimchi', 'buchu', 'zucchini', 'potato', 'squid', 'onion', 'carrot', 'pepper'];
const BASE_ORDER = ['kimchi', 'buchu', 'potato', 'zucchini', 'squid', 'onion', 'carrot', 'pepper'];
/* 숨은 레시피 (재료 조합이 정확히 같을 때) — 제가 만든 초안 */
const RECIPES = [
  { set: ['buchu', 'onion', 'squid'], n: '해물 부추전' },
  { set: ['carrot', 'onion', 'zucchini'], n: '알록달록 채소전' },
  { set: ['kimchi', 'buchu', 'onion', 'squid'], n: '할머니표 모둠전' },
  { set: ['potato', 'onion'], n: '감자 양파전' },
  { set: ['kimchi', 'pepper', 'squid'], n: '얼큰 오징어 김치전' },
  { set: ['potato', 'carrot', 'zucchini'], n: '채소 감자전' },
];
const FLOURS = [
  { n: '부침가루', d: '간이 돼 있어 무난함', c: '#c8452f' },
  { n: '밀가루',   d: '담백하고 쫀득함',     c: '#4f6f8a' },
  { n: '튀김가루', d: '바삭함이 강함',       c: '#d99a2b' },
];
const PLATES = [
  { n: '하얀 접시' },
  { n: '꽃무늬 접시' },
  { n: '대나무 채반' },
];
const DIPS = [
  { n: '초간장', c: '#4a2a1a' },
  { n: '양념간장', c: '#6a2a18' },
  { n: '그냥 먹기', c: null },
];
const STAGES = ['재료 고르기', '손질하기', '반죽 만들기', '굽기', '담기', '저녁 식탁'];

/* 할머니 안내 (제가 만든 초안 — 직접 고쳐 쓰시면 됩니다) */
const TIP = [
  '오랜만에 와서 네가 해 준다고? 냉장고 열어 봐라. 네 가지까지.',
  '도마 위를 톡톡 눌러서 썰어. 손 조심하고.',
  '가루 고르고, 주전자를 꾹 눌러 물 붓고, 그릇을 꾹 눌러 섞어.',
  '기름병 눌러 기름 두르고, 팬을 눌러 부어. 톡 뒤집기, 꾹 센불.',
  '예쁘게 담자. 먹는 것도 눈이 먼저다.',
  '다들 와서 앉아라. 얘가 부쳤다.',
];

const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);

function recipeName(items) {
  const key = [...items].sort().join(',');
  const hit = RECIPES.find(r => [...r.set].sort().join(',') === key);
  if (hit) return hit.n;
  if (items.length >= 4) return '냉장고 털이전';
  const base = BASE_ORDER.find(k => items.includes(k));
  const pre = BASE_ORDER.filter(k => items.includes(k) && k !== base).reverse().map(k => ING[k].w);
  const baseName = { kimchi: '김치전', buchu: '부추전', potato: '감자전', zucchini: '애호박전', squid: '오징어전', onion: '양파전', carrot: '당근전', pepper: '고추전' }[base];
  return [...pre, baseName].join(' ');
}

const STOPS = [[0, '#efe2b8'], [45, '#e8cf8a'], [60, '#dba54a'], [80, '#c27f2c'], [95, '#6b4018'], [110, '#2a1c12']];
function hex2rgb(h) { h = h.slice(1); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function doneColor(v) {
  v = clamp(v, 0, 110);
  for (let i = 0; i < STOPS.length - 1; i++) {
    const [a, ca] = STOPS[i], [b, cb] = STOPS[i + 1];
    if (v <= b) {
      const t = (v - a) / (b - a), A = hex2rgb(ca), B = hex2rgb(cb);
      return `rgb(${A.map((x, j) => Math.round(lerp(x, B[j], t))).join(',')})`;
    }
  }
  return STOPS[STOPS.length - 1][1];
}
function doneness(v) {
  if (v < 40) return 'raw';
  if (v < 55) return 'soft';
  if (v <= 82) return 'gold';
  if (v <= 95) return 'dark';
  return 'burnt';
}
const DONE_WORD = { raw: '덜 익음', soft: '살짝 덜 익음', gold: '노릇노릇', dark: '진하게 익음', burnt: '탐' };
function batterOf(w) { return w < 35 ? 'thick' : w > 65 ? 'thin' : 'ok'; }
const BATTER_WORD = { thick: '되직함', ok: '딱 좋음', thin: '묽음' };

/* ================= 가족 ================= */
const FAMILY = [
  { n: '할머니', x: 200, look: { skin: '#f0cfae', hair: '#a8a29a', shirt: '#7a5a6a', style: 'bun', glasses: false, small: false } },
  { n: '아빠',   x: 384, look: { skin: '#e6b48f', hair: '#2b2420', shirt: '#3f5a73', style: 'short', glasses: true, small: false } },
  { n: '엄마',   x: 576, look: { skin: '#f1cfae', hair: '#4a3426', shirt: '#a0703c', style: 'bob', glasses: false, small: false } },
  { n: '동생',   x: 760, look: { skin: '#f5d9bf', hair: '#1f1a1e', shirt: '#6f8f4e', style: 'cap', glasses: false, small: true } },
];
/* 반응 규칙 (제가 만든 초안). r = 결과 정보 */
function reactions(r) {
  const has = k => r.items.includes(k);
  const bad = r.qa === 'burnt' || r.qb === 'burnt';
  const raw = r.qa === 'raw' || r.qb === 'raw';
  const gold = r.qa === 'gold' && r.qb === 'gold';
  const crispy = r.oil >= 3 || r.batter === 'thin' || r.flour === 2;
  const out = [];
  // 할머니: 굽기와 반죽
  if (bad) out.push(['탄 것도 전이다. 다음엔 불 좀 줄여라.', 'meh']);
  else if (raw) out.push(['속이 덜 익었다. 조금만 더 기다리지.', 'meh']);
  else if (r.oil === 0) out.push(['기름을 안 둘렀구나. 눌었다.', 'meh']);
  else if (gold && r.batter === 'ok') out.push(['내가 가르친 보람이 있네. 색 곱다.', 'love']);
  else if (r.batter === 'thick') out.push(['두툼하니 든든하네.', 'good']);
  else if (r.batter === 'thin') out.push(['얇게 잘 폈다. 바삭하네.', 'good']);
  else out.push(['잘했다. 처음엔 다 이렇게 하는 거다.', 'good']);
  // 아빠: 칼칼한 것, 김치
  if (bad) out.push(['아빠는 탄 것도 잘 먹어.', 'good']);
  else if (has('pepper')) out.push(['캬, 칼칼하다! 이거 하나 더 없나?', 'love']);
  else if (has('kimchi')) out.push(['비 오는 날엔 역시 김치전이지.', 'love']);
  else if (crispy) out.push(['바삭바삭 소리 좋다.', 'good']);
  else out.push(['우리 애 다 컸네. 맛있다.', 'good']);
  // 엄마: 채소, 기름
  const veg = ['buchu', 'zucchini', 'onion', 'carrot'].filter(has).length;
  if (r.oil >= 3) out.push(['맛은 있는데 기름이 좀 많다~', 'meh']);
  else if (veg >= 2) out.push(['채소가 듬뿍이라 좋다.', 'love']);
  else if (has('squid')) out.push(['오징어가 쫄깃하네.', 'good']);
  else if (raw) out.push(['조금만 더 익혀 줄래?', 'meh']);
  else out.push(['거기서 밥은 잘 해 먹고 다니는구나.', 'good']);
  // 동생: 매운 것 싫음, 감자 좋아함
  if (has('pepper')) out.push(['으악 매워!! 물! 물!', 'sad']);
  else if (r.items.length >= 4) out.push(['이게 다 뭐야?! …근데 맛있네.', 'good']);
  else if (bad) out.push(['이거 까매…', 'sad']);
  else if (has('potato')) out.push(['감자 쫀득해서 좋아!', 'love']);
  else if (has('kimchi')) out.push(['김치전 최고!', 'love']);
  else if (has('zucchini') || has('carrot')) out.push(['채소… 나 채소 싫은데.', 'meh']);
  else out.push(['음, 괜찮네.', 'good']);
  return out;
}

/* ================= 상태 ================= */
let phase = 'title', stage = 0, showDex = false;
let S;
let msg = '', msgT = 0, parts = [], hold = null, clock = 0;
let dex = {};
try { const s = JSON.parse(localStorage.getItem('jeon-family-dex-v1') || '{}'); if (s && typeof s === 'object') dex = s; } catch (e) {}
function saveDex() { try { localStorage.setItem('jeon-family-dex-v1', JSON.stringify(dex)); } catch (e) {} }
function say(s) { msg = s; msgT = 0; }
function freshRound() {
  S = {
    picks: [], cutIdx: 0, cuts: {}, chopA: 1, pile: [], advT: 0,
    flour: -1, water: 0, mix: 0, rot: 0, bowlSpecks: [],
    oil: 0, pan: { st: 'empty', sides: [0, 0], cur: 0, anim: 0, hold: false, warned: [0, 0] }, jeon: null,
    plate: 0, dip: 0, cut: 0, result: null, tableT: 0, doneT: 0,
  };
  stage = 0; say(TIP[0]);
}
function goStage(n) {
  stage = n; say(TIP[n]);
  if (n === 1) { S.cutIdx = 0; S.picks.forEach(k => S.cuts[k] = 0); }
  if (n === 2) {
    S.bowlSpecks = [];
    S.picks.forEach(k => { for (let i = 0; i < Math.max(4, ING[k].sp / 2); i++) S.bowlSpecks.push({ k, a: rnd(0, 6.28), d: rnd(0.1, 0.8), r: rnd(0, 6.28) }); });
  }
  if (n === 3) S.jeon = makeJeon(S.picks);
  if (n === 5) { buildResult(); S.tableT = 0; }
}

/* ================= 소리 ================= */
let AC = null, master = null, muted = false, sizz = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.6; master.connect(AC.destination);
    const len = AC.sampleRate * 2, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < 0.015 ? 1 : 0.3);
    const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
    const hp = AC.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
    sizz = AC.createGain(); sizz.gain.value = 0;
    src.connect(hp); hp.connect(sizz); sizz.connect(master); src.start();
  } catch (e) { AC = null; }
}
function tone(f, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
  if (!AC || muted) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.03);
}
const sfx = {
  pick: () => tone(660, 0.08, 'triangle', 0.08),
  unpick: () => tone(440, 0.08, 'triangle', 0.06),
  chop: () => { tone(200, 0.06, 'square', 0.1, -90); tone(2400, 0.02, 'square', 0.02); },
  water: () => tone(rnd(500, 700), 0.06, 'sine', 0.03, -200),
  stir: () => tone(rnd(180, 260), 0.05, 'sine', 0.03),
  oil: () => { tone(320, 0.12, 'sine', 0.06, -120); },
  pour: () => tone(300, 0.25, 'sine', 0.08, -120),
  flip: () => { tone(150, 0.13, 'triangle', 0.3, -70); tone(900, 0.05, 'square', 0.03, 0, 0.02); },
  ok: () => { tone(660, 0.1, 'triangle', 0.08); tone(990, 0.15, 'triangle', 0.08, 0, 0.09); },
  ding: () => tone(1040, 0.12, 'triangle', 0.07),
  table: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'sine', 0.06, 0, i * 0.09)); },
  pop: i => tone(520 + i * 90, 0.12, 'sine', 0.07),
};

/* ================= 동작 ================= */
function makeJeon(items) {
  const shape = Array.from({ length: 22 }, () => rnd(0.9, 1.05));
  const specks = [];
  items.forEach(k => { for (let i = 0; i < ING[k].sp; i++) { const d = Math.sqrt(Math.random()) * 0.74, a = rnd(0, 6.28); specks.push({ k, x: Math.cos(a) * d, y: Math.sin(a) * d, r: rnd(0, 6.28) }); } });
  return { items: [...items], shape, specks };
}
function togglePick(k) {
  const i = S.picks.indexOf(k);
  if (i >= 0) { S.picks.splice(i, 1); sfx.unpick(); say(`${ING[k].n} 도로 넣었다.`); return; }
  if (S.picks.length >= 4) { say('네 가지면 충분하다. 하나 빼고 골라.'); return; }
  S.picks.push(k); sfx.pick();
  say(S.picks.length === 1 ? `${ING[k].n} 좋지. 더 넣어도 되고.` : `${S.picks.map(x => ING[x].n).join(', ')}. 무슨 전이 될까?`);
}
function chop() {
  const k = S.picks[S.cutIdx];
  if (!k || S.chopA < 1 || S.cuts[k] >= ING[k].chops) return;
  S.chopA = 0; sfx.chop();
  S.cuts[k]++;
  for (let i = 0; i < 3; i++) S.pile.push({ k, x: rnd(-70, 70), y: rnd(-40, 40), r: rnd(0, 6.28) });
  if (S.cuts[k] >= ING[k].chops) {
    sfx.ding();
    if (S.cutIdx < S.picks.length - 1) { say(`${ING[k].n} 다 썰었다. 다음은 ${ING[S.picks[S.cutIdx + 1]].n}.`); }
    else say('손질 끝. 반죽하러 가자.');
    S.advT = 0.35;
  }
}
function allCut() { return S.picks.every(k => S.cuts[k] >= ING[k].chops) && S.cutIdx >= S.picks.length; }
function batterReady() { return S.flour >= 0 && S.water >= 15 && S.mix >= 1; }
function panTap() {
  const p = S.pan;
  if (p.st === 'empty') {
    if (S.oil === 0) say('기름 없이 부으면 눌어붙는다. …그래도 해 보자.');
    else say('지글지글. 가장자리 색 보면서 기다려.');
    p.st = 'pour'; p.anim = 0; sfx.pour();
  } else if (p.st === 'cook' && p.cur === 0) {
    p.st = 'flip'; p.anim = 0; p.cur = 1; sfx.flip(); say('잘 뒤집었다. 이제 윗면.');
  } else if (p.st === 'cook' && p.cur === 1) {
    toPlate();
  }
}
function toPlate() { sfx.ok(); goStage(4); }
function buildResult() {
  const name = recipeName(S.picks);
  const qa = doneness(S.pan.sides[0]), qb = doneness(S.pan.sides[1]);
  const r = { items: [...S.picks], qa, qb, oil: S.oil, batter: batterOf(S.water), flour: S.flour, name };
  let adj = '';
  if (qa === 'burnt' || qb === 'burnt') adj = '까맣게 탄';
  else if (qa === 'raw' || qb === 'raw') adj = '덜 익은';
  else if (S.oil >= 3 || S.flour === 2) adj = '바삭한';
  else if (r.batter === 'thin') adj = '얇은';
  else if (r.batter === 'thick') adj = '두툼한';
  else if (qa === 'gold' && qb === 'gold') adj = '노릇노릇';
  r.full = adj ? `${adj} ${name}` : name;
  r.react = reactions(r);
  r.hearts = r.react.filter(x => x[1] === 'love' || x[1] === 'good').length;
  r.isNew = !(name in dex);
  dex[name] = Math.max(dex[name] || 0, r.hearts);
  saveDex();
  S.result = r;
}

function btnState() {
  switch (stage) {
    case 0: return { label: '손질하러 가기', on: S.picks.length > 0 };
    case 1: return { label: '반죽하러 가기', on: allCut() };
    case 2: return { label: '굽으러 가기', on: batterReady() };
    case 3: return { label: '접시에 담기', on: S.pan.st === 'cook' && S.pan.cur === 1 };
    case 4: return { label: '식탁에 내기', on: true };
    case 5: return { label: '한 장 더 부치기', on: S.tableT > 3.2 };
  }
  return { label: '', on: false };
}
function btnPress() {
  const b = btnState();
  if (!b.on) {
    const why = [
      '하나는 골라야 전을 부치지.',
      '아직 덜 썰었다. 도마를 톡톡.',
      S.flour < 0 ? '가루부터 골라.' : S.water < 15 ? '물이 모자라다. 주전자를 꾹.' : '덜 섞였다. 그릇을 꾹 누르고 있어.',
      S.pan.st === 'empty' ? '팬을 눌러서 반죽부터 부어.' : '먼저 뒤집어야지. 팬을 톡.',
    ][stage];
    if (why) say(why);
    return;
  }

/* ================= 업데이트 ================= */
function update(dt) {
  clock += dt; msgT += dt;
  if (phase === 'intro') introT += dt;
  if (phase !== 'play') return;
  if (stage === 1) {
    S.chopA = Math.min(1, S.chopA + dt / 0.14);
    if (S.advT > 0) { S.advT -= dt; if (S.advT <= 0) { S.advT = 0; S.cutIdx++; S.pile = []; } }
  }
  if (stage === 2 && hold) {
    if (hold.k === 'pitcher') {
      if (S.water < 100) { S.water = Math.min(100, S.water + 22 * dt); if (Math.random() < dt * 10) sfx.water(); if (S.mix > 0.4) S.mix = 0.4; }
      if (S.water >= 100 && msgT > 1) say('물이 너무 많다! 그만 부어.');
    } else if (hold.k === 'bowl') {
      if (S.flour < 0) { if (msgT > 1) say('가루부터 골라.'); }
      else if (S.water < 15) { if (msgT > 1) say('물부터 부어. 주전자를 꾹.'); }
      else if (S.mix < 1) { S.mix = Math.min(1, S.mix + dt * 0.7); S.rot += dt * 7; if (Math.random() < dt * 7) sfx.stir(); if (S.mix >= 1) { sfx.ding(); say(`반죽 ${BATTER_WORD[batterOf(S.water)]}. 굽으러 가자.`); } }
      else S.rot += dt * 7;
    }
  }
  if (stage === 3) {
    const p = S.pan;
    p.hold = !!(hold && hold.k === 'pan' && performance.now() - hold.t0 > 220 && p.st === 'cook');
    if (p.st === 'pour') { p.anim += dt / 0.4; if (p.anim >= 1) { p.st = 'cook'; p.anim = 0; } }
    if (p.st === 'flip') { p.anim += dt / 0.45; if (p.anim >= 1) { p.st = 'cook'; p.anim = 0; } }
    if (p.st !== 'empty') {
      p.sides[p.cur] += 8 * (p.hold ? 2 : 1) * dt;
      const v = p.sides[p.cur];
      if (v >= 55 && !p.warned[p.cur]) { p.warned[p.cur] = 1; sfx.ding(); say(p.cur === 0 ? '지금이다! 노릇하다. 톡 눌러 뒤집어.' : '다 익었다! 접시에 담자.'); }
      if (v > 95 && p.warned[p.cur] < 2) { p.warned[p.cur] = 2; say('타는 냄새 난다! 얼른!'); }
      if (v > 95 && Math.random() < dt * 9) parts.push({ kind: 'smoke', x: PAN.x + rnd(-60, 60), y: PAN.y + rnd(-30, 30), vx: rnd(-8, 8), vy: rnd(-40, -25), life: 0, max: rnd(1.2, 2) });
      else if (Math.random() < dt * 4) parts.push({ kind: 'steam', x: PAN.x + rnd(-70, 70), y: PAN.y + rnd(-40, 40), vx: rnd(-5, 5), vy: rnd(-35, -20), life: 0, max: rnd(0.8, 1.3) });
      if (p.hold && Math.random() < dt * 20) parts.push({ kind: 'oil', x: PAN.x + rnd(-90, 90), y: PAN.y + rnd(-60, 50), vx: rnd(-40, 40), vy: rnd(-90, -50), life: 0, max: 0.35 });
    }
  }
  if (stage === 5) {
    const before = Math.floor((S.tableT - 0.6) / 0.6);
    S.tableT += dt;
    const after = Math.floor((S.tableT - 0.6) / 0.6);
    if (after !== before && after >= 0 && after < 4) sfx.pop(after);
  }
  if (AC && sizz) sizz.gain.setTargetAtTime(muted || stage !== 3 || S.pan.st === 'empty' ? 0 : (S.pan.hold ? 0.2 : 0.09), AC.currentTime, 0.08);
  parts.forEach(q => { q.life += dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.kind === 'oil') q.vy += 300 * dt; });
  parts = parts.filter(q => q.life < q.max);
}

  txt(muted ? '소리 끔' : '소리 켬', MUTE.x + MUTE.w / 2, MUTE.y + 23, 14, '#d9cdb8', 'center', FS);
}
function drawParts() {
  parts.forEach(q => {
    const k = q.life / q.max;
    if (q.kind === 'steam') { ctx.globalAlpha = 0.25 * (1 - k); ctx.fillStyle = '#f2f2f2'; circle(q.x, q.y, 8 + k * 12); ctx.fill(); }
    else if (q.kind === 'smoke') { ctx.globalAlpha = 0.45 * (1 - k); ctx.fillStyle = '#55504a'; circle(q.x, q.y, 10 + k * 20); ctx.fill(); }
    else if (q.kind === 'oil') { ctx.globalAlpha = 1 - k; ctx.fillStyle = '#ffe9a8'; circle(q.x, q.y, 1.8); ctx.fill(); }
  });
  ctx.globalAlpha = 1;
}

/* ================= 입력 ================= */
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
const inR = (x, y, b) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
const dist = (x, y, a, b) => Math.hypot(x - a, y - b);
function hit(x, y) {
  if (showDex) return { k: 'closedex' };
  if (phase === 'intro') return inR(x, y, SKIP) ? { k: 'skip' } : { k: 'introNext' };
  if (inR(x, y, MUTE)) return { k: 'mute' };
  if (inR(x, y, DEXB)) return { k: 'dex' };
  if (phase === 'title') return inR(x, y, START) ? { k: 'start' } : null;
  if (inR(x, y, BTN)) return { k: 'btn' };
  if (stage === 0) { for (const c of CARDS) if (inR(x, y, c)) return { k: 'card', id: c.k }; }
  if (stage === 1 && inR(x, y, BOARD)) return { k: 'board' };
  if (stage === 2) {
    for (const b of BAGS) if (inR(x, y, b)) return { k: 'flour', i: b.i };
    if (inR(x, y, { x: PITCHER.x - 20, y: PITCHER.y, w: PITCHER.w + 40, h: PITCHER.h + 30 })) return { k: 'pitcher' };
    if (dist(x, y, BIGBOWL.x, BIGBOWL.y) < BIGBOWL.r + 12) return { k: 'bowl' };
  }
  if (stage === 3) {
    if (inR(x, y, OIL)) return { k: 'oil' };
    if (dist(x, y, PAN.x, PAN.y) < PAN.r + 12) return { k: 'pan' };
  }
  if (stage === 4) {
    for (const o of PL_OPTS) if (inR(x, y, o)) return { k: 'plate', i: o.i };
    for (const o of DIP_OPTS) if (inR(x, y, o)) return { k: 'dip', i: o.i };
    for (const o of CUT_OPTS) if (inR(x, y, o)) return { k: 'cut', i: o.i };
  }
  return null;
}
function act(h) {
  switch (h.k) {
    case 'closedex': showDex = false; break;
    case 'dex': showDex = true; break;
    case 'mute': muted = !muted; if (master) master.gain.value = muted ? 0 : 0.6; break;
    case 'start': phase = 'intro'; introI = 0; introT = 0; break;
    case 'skip': phase = 'play'; freshRound(); break;
    case 'introNext': introNext(); break;
    case 'btn': btnPress(); break;
    case 'card': togglePick(h.id); break;
    case 'board': chop(); break;
    case 'flour': S.flour = h.i; sfx.pick(); say(`${FLOURS[h.i].n}. ${FLOURS[h.i].d}.`); break;
    case 'oil':
      if (S.pan.st !== 'empty') { say('기름은 붓기 전에 두르는 거다.'); break; }
      S.oil = (S.oil + 1) % 4; sfx.oil();
      say(['기름 안 두르면 눌어붙는다.', '조금만 둘렀다.', '적당하다. 이 정도면 됐다.', '듬뿍! 바삭하겠지만 엄마가 뭐라 하겠다.'][S.oil]); break;
    case 'plate': S.plate = h.i; sfx.pick(); break;
    case 'dip': S.dip = h.i; sfx.pick(); break;
    case 'cut': S.cut = h.i; sfx.chop(); break;
  }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();
  const [x, y] = pos(e); const h = hit(x, y);
  if (!h) return;
  if (h.k === 'bowl' || h.k === 'pan' || h.k === 'pitcher') {
    hold = { ...h, t0: performance.now() };
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    return;
  }
  act(h);
});
cv.addEventListener('pointermove', e => {
  if (!hold) return;
  const [x, y] = pos(e); const h = hit(x, y);
  if (!h || h.k !== hold.k) { hold = null; S.pan.hold = false; }
});
cv.addEventListener('pointerup', () => {
  if (!hold) return;
  if (hold.k === 'pan' && performance.now() - hold.t0 < 220) panTap();
  hold = null;
});
cv.addEventListener('pointercancel', () => { hold = null; });
cv.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault(); initAudio();
    if (showDex) showDex = false;
    else if (phase === 'title') act({ k: 'start' });
    else if (phase === 'intro') introNext();
    else if (stage === 1 && !allCut()) chop();
    else btnPress();
  }
});

/* ================= 루프 ================= */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(frame);
}
freshRound();
requestAnimationFrame(frame);
window.__jeon = { get state() { return { phase, stage, S }; } };
})();
</script>
